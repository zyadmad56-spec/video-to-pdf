[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-pdf"
version = "0.2.0"
description = "Portable source processing and document production for lecture videos"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["lecture", "transcription", "pdf", "pptx", "study-notes"]
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.24",
  "pypdf>=4.0",
  "PyMuPDF>=1.24",
  "python-pptx>=0.6.23",
  "playwright>=1.40",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
youtube = ["yt-dlp[default]>=2026.10.21"]
windows = ["pywin32>=306; platform_system == 'Windows'"]
all = [
  "faster-whisper>=1.0",
  "yt-dlp[default]>=2026.10.21",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
lecture-materials = "lecture_materials.cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
packages = ["lecture_materials"]

[tool.setuptools.package-data]
lecture_materials = ["*.py"]
