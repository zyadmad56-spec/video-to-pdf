name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-liberation
      - name: Install Python and browser dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-youtube.txt
          python -m playwright install --with-deps chromium
      - name: Run regression tests
        run: python -X utf8 -m unittest discover -s tests -q
